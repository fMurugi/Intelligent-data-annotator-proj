<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compare Vegetation Cover Over Time</title>

    <!-- Leaflet & Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
    <script src="https://unpkg.com/esri-leaflet/dist/esri-leaflet.js"></script>

    <!-- PDF & Image Capture Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css"/>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
            height: 100vh;
            flex-direction: column;
        }
        .map-container {
            flex: 1;
            height: 100%;
            position: relative;
            border: 2px solid black;
            margin: 5px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.2);
        }
        #controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 10px;
            background: white;
            border-bottom: 2px solid black;
        }
        .download-btn {
            background: #28a745;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .download-btn:hover {
            background: #218838;
        }
    </style>
</head>
<body>

    <div id="controls">
        <input id="search-input" type="text" placeholder="Search for a place (e.g., Mount Kenya Forest)">
        <button id="search-btn">Search</button>
        <label for="past-year">Past Year:</label>
        <input type="number" id="past-year" min="2000" max="2025" value="2000">
        <label for="current-year">Current Year:</label>
        <input type="number" id="current-year" min="2000" max="2025" value="2025">
        <button id="download-pdf" class="download-btn">📄 Download PDF</button>
    </div>

    <div class="map-container" id="map-left-container">
        <h3 style="text-align:center;">Past NDVI</h3>
        <div id="map-left" style="height: 90%;"></div>
    </div>
    
    <div class="map-container" id="map-right-container">
        <h3 style="text-align:center;">Current NDVI</h3>
        <div id="map-right" style="height: 90%;"></div>
    </div>

    <script>
        var mapLeft = L.map('map-left').setView([-1.28333, 36.82194], 8);
        var mapRight = L.map('map-right').setView([-1.28333, 36.82194], 8);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(mapLeft);
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(mapRight);

        let isSyncing = false;
        function syncMaps(sourceMap, targetMap) {
            sourceMap.on("moveend", function () {
                if (isSyncing) return;
                isSyncing = true;
                targetMap.setView(sourceMap.getCenter(), sourceMap.getZoom(), { animate: false });
                isSyncing = false;
            });
        }

        syncMaps(mapLeft, mapRight);
        syncMaps(mapRight, mapLeft);

        var leftLayer, rightLayer;
        let lastSearchBounds = null;

        function searchLocation() {
            var query = document.getElementById("search-input").value;
            if (!query) {
                alert("Please enter a location name!");
                return;
            }

            fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${query}`)
                .then(response => response.json())
                .then(data => {
                    if (data.length === 0) {
                        alert("Location not found!");
                        return;
                    }

                    var lat = parseFloat(data[0].lat);
                    var lon = parseFloat(data[0].lon);
                    var bounds = [
                        [lat - 0.1, lon - 0.1], 
                        [lat + 0.1, lon + 0.1]  
                    ];

                    mapLeft.fitBounds(bounds);
                    mapRight.fitBounds(bounds);

                    lastSearchBounds = bounds;

                    fetchNDVI(bounds[0], bounds[1], document.getElementById("past-year").value, "left");
                    fetchNDVI(bounds[0], bounds[1], document.getElementById("current-year").value, "right");
                })
                .catch(error => console.error("Error fetching location:", error));
        }

        function fetchNDVI(southWest, northEast, year, side) {
            fetch('http://127.0.0.1:5000/get_ndvi', {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    south: southWest[0],
                    west: southWest[1],
                    north: northEast[0],
                    east: northEast[1],
                    year: year
                })
            })
            .then(response => response.json())
            .then(data => {
                if (!data.map_url) {
                    alert("Failed to load vegetation data.");
                    return;
                }

                let newLayer = L.tileLayer(data.map_url, { opacity: 0.7 });

                if (side === "left") {
                    if (leftLayer) mapLeft.removeLayer(leftLayer);
                    leftLayer = newLayer;
                    leftLayer.addTo(mapLeft);
                } else {
                    if (rightLayer) mapRight.removeLayer(rightLayer);
                    rightLayer = newLayer;
                    rightLayer.addTo(mapRight);
                }
            })
            .catch(error => console.error("Error fetching NDVI data:", error));
        }

        document.getElementById("search-btn").addEventListener("click", searchLocation);
        document.getElementById("past-year").addEventListener("change", function () {
            if (lastSearchBounds) fetchNDVI(lastSearchBounds[0], lastSearchBounds[1], this.value, "left");
        });
        document.getElementById("current-year").addEventListener("change", function () {
            if (lastSearchBounds) fetchNDVI(lastSearchBounds[0], lastSearchBounds[1], this.value, "right");
        });

        // 📄 Generate PDF with both maps
        document.getElementById("download-pdf").addEventListener("click", async function () {
        const { jsPDF } = window.jspdf;
        let pdf = new jsPDF("p", "mm", "a4"); // Portrait, millimeters, A4 size

        let locationName = document.getElementById("search-input").value || "Unknown Location";
        let pastYear = document.getElementById("past-year").value;
        let currentYear = document.getElementById("current-year").value;

        async function captureMap(mapElementId) {
            return new Promise((resolve) => {
                let mapElement = document.getElementById(mapElementId);
                
                // Ensure the map tiles are loaded before capturing
                setTimeout(async () => {
                    html2canvas(mapElement, {
                        useCORS: true,
                        allowTaint: true,
                        logging: false,
                        scale: 3 // Increases resolution for clearer images
                    }).then(canvas => {
                        resolve(canvas.toDataURL("image/png"));
                    });
                }, 2000); // Wait 2 seconds to ensure map rendering is complete
            });
        }

        // Capture both maps
        let leftImage = await captureMap("map-left-container");
        let rightImage = await captureMap("map-right-container");

        // 📄 Add title and location info
        pdf.setFont("helvetica", "bold");
        pdf.setFontSize(16);
        pdf.text("NDVI Comparison Report", 105, 15, { align: "center" });

        pdf.setFont("helvetica", "normal");
        pdf.setFontSize(12);
        pdf.text(`Location: ${locationName}`, 10, 25);
        pdf.text(`Comparison: ${pastYear} vs. ${currentYear}`, 10, 35);

        // 📌 Add images (making them bigger and clearer)
        pdf.addImage(leftImage, "PNG", 10, 45, 90, 80);  // Left map (Past NDVI)
        pdf.text(`Past NDVI (${pastYear})`, 45, 130, { align: "center" });

        pdf.addImage(rightImage, "PNG", 110, 45, 90, 80); // Right map (Current NDVI)
        pdf.text(`Current NDVI (${currentYear})`, 145, 130, { align: "center" });

        // 📄 Save the PDF file
        pdf.save(`NDVI_Comparison_${locationName}_${pastYear}_vs_${currentYear}.pdf`);
    });
    </script>

</body>
</html>
